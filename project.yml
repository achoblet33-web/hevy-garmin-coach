name: HevyGarminCoach
options:
  bundleIdPrefix: com.hevygarmin
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
targets:
  HevyGarminCoach:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/HevyGarminCoach.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hevygarmin.coach
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: HealthKit.framework
      - sdk: Security.framework
