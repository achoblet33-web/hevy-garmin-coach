name: TrainSync v3 checks
on:
  pull_request:
    paths:
      - "Backend/**"
      - "web/**"
      - "preview/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/trainsync-v3-checks.yml"
  push:
    branches: ["feat/trainsync-3-intervals-hub"]
    paths:
      - "Backend/**"
      - "web/**"
      - "preview/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/trainsync-v3-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check web/trainsync-v3.js
          node --check web/plan-engine.mjs
          node --check web/runna-style-plan.mjs
          node --check web/runna-next/app.mjs
          node --check Backend/worker-v30.js
          node --check Backend/running-workouts.mjs
          node --check preview/worker.js
          node --check preview/server.mjs
      - name: Unit and API tests (no network keys)
        run: npm test
      - name: Wrangler package build validation only (NO DEPLOY)
        run: |
          npx --yes wrangler@latest deploy --dry-run --config Backend/wrangler.jsonc
          npx --yes wrangler@latest deploy --dry-run --config preview/wrangler.jsonc
  smoke-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify isolated Railway staging (fake data only)
        run: node tests/staging-smoke.mjs
  production-config-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check public production /health without modifying it
        run: node tests/production-health-readonly.mjs
